site:
  id: "oroshaza"
  name: "Orosháza titkos múltja"
  subtitle: "Az ügynökakták nyomában – Forrásalapú helytörténeti kutatóplatform"
  description: "Ingyenes, nyilvános, térképes kutatóplatform az 1945–1990 közötti orosházi állambiztonsági iratok vizsgálatára, szigorú forráshivatkozással és adatvédelemmel."
  initiator:
    name: "Kátai Attila"
    title: "AI specialista, projektgazda"
    contact: "katai.attila@example.hu"
  
settlement:
  name: "Orosháza"
  county: "Békés vármegye"
  country: "Magyarország"
